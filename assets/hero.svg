  <style>
    .mono{font-family:ui-monospace,'SF Mono',Consolas,'Liberation Mono',Menlo,monospace}
    .jp{font-family:'Yu Gothic','Hiragino Sans','Noto Sans JP','Meiryo',sans-serif;font-weight:900}
    .boilA{animation:boilA .9s steps(1) infinite}
    .boilB{animation:boilB .9s steps(1) infinite}
    @keyframes boilA{0%{opacity:1}50%{opacity:0}}
    @keyframes boilB{0%{opacity:0}50%{opacity:1}}
