    .g2{animation:g2 5s steps(1) infinite}
    .jit{animation:jit 5s steps(1) infinite}
    @keyframes g1{0%,86%{opacity:0;transform:none}87%{opacity:1;transform:translate(-18px,0)}89%{transform:translate(14px,0)}91%{transform:translate(-7px,0)}92%,100%{opacity:0;transform:none}}
