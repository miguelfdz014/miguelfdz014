    .stamp{transform-box:fill-box;transform-origin:center;animation:stamp .5s cubic-bezier(.3,1.6,.5,1) 3.4s both}
    @keyframes stamp{from{opacity:0;transform:scale(1.8) rotate(-7deg)}to{transform:rotate(-7deg)}}
    @media (prefers-reduced-motion:reduce){.ink,.row,.stamp{animation:none}.ink{opacity:1}.stamp{transform:rotate(-7deg)}}
  </style>
