<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 48" width="1200" height="48" role="presentation">
  <style>
    .draw{stroke-dasharray:480;stroke-dashoffset:480;animation:draw 1.6s cubic-bezier(.3,.7,.2,1) .2s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .star{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.draw{animation:none;stroke-dashoffset:0}.star{animation:none}}
  </style>
